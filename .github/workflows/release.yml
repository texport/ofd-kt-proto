# Выпуск модулей протокола на GitHub и в Maven Central.
#
# Сам: после зелёного CI на main выпускается каждый модуль, который ещё не
# выпускался или менялся с последней своей метки. Номер сборки — следующий
# после последней метки протокола (v2.0.4-1, v2.0.4-2, …); метку ставит
# сам выпуск. Переменная репозитория AUTO_RELEASE=false это выключает.
#
# Руками: метка v<протокол>-<номер> выпускает модуль этого протокола.
#
# Порядок: файлы → выпуск на GitHub → Maven Central. Упала ступень —
# следующие не запускаются. Без секретов Central выгрузка пропускается
# с уведомлением в сводке запуска.
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_run:
    workflows: [ 'CI Build' ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.plan.outputs.modules }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE || 'true' }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          bash .github/scripts/release-plan.sh

  # По ручной метке проверка ещё не шла; после CI на main она уже зелёная.
  checks:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.modules != '[]'
    uses: ./.github/workflows/ci.yml

  artifacts:
    needs: [ plan, checks ]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.modules != '[]' &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    runs-on: macos-latest
    strategy:
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать jar и aar
        env:
          NAME: ${{ matrix.module.name }}
          VERSION: ${{ matrix.module.version }}
        run: ./gradlew ":$NAME:jvmJar" ":$NAME:bundleAndroidMainAar" -PreleaseVersion="$VERSION"

      - name: Сложить файлы выпуска
        env:
          VERSION: ${{ matrix.module.version }}
          DIR: ${{ matrix.module.dir }}
          NAME: ${{ matrix.module.name }}
        run: |
          mkdir -p dist
          cp "$DIR/build/libs/$NAME-jvm-$VERSION.jar" dist/
          aar=$(find "$DIR/build/outputs/aar" -name '*.aar' | head -1)
          test -s "$aar" || { echo "::error::aar не собрался"; exit 1; }
          cp "$aar" "dist/$NAME-android-$VERSION.aar"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.module.name }}
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: [ plan, artifacts ]
    if: ${{ !cancelled() && needs.artifacts.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    steps:
      # Вся история с метками — для заметок о выпуске.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.module.name }}
          path: dist

      - name: Заметки о выпуске
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: bash .github/scripts/release-notes.sh && cat notes.md

      # Выпуск мог быть заведён руками — тогда файлы докладываются в него
      # поверх прежних, а заметки остаются те, что написаны руками. Иначе
      # выпуск создаётся вместе с меткой на выпускаемом коммите.
      - name: Выпуск на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.module.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          NAME: ${{ matrix.module.name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "$NAME $TAG" --notes-file notes.md dist/*
          fi
          echo "- Выпуск на GitHub: $TAG" >> "$GITHUB_STEP_SUMMARY"

  # В Central — только после выпуска на GitHub. Без секретов выгрузка
  # пропускается с уведомлением, запуск остаётся зелёным; когда секреты
  # заведены, модуль выгружается сам со следующим выпуском.
  maven-central:
    needs: [ plan, github-release ]
    if: ${{ !cancelled() && needs.github-release.result == 'success' }}
    runs-on: macos-latest
    strategy:
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    env:
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
    steps:
      - name: Секреты на месте
        id: secrets
        run: |
          missing=""
          for name in OSSRH_USERNAME OSSRH_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            message="Maven Central пропущен: не заведены секреты репозитория$missing. Выпуск на GitHub создан."
            echo "::notice title=Maven Central::$message"
            echo "- $message" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - if: steps.secrets.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Выгрузить в Maven Central
        if: steps.secrets.outputs.present == 'true'
        env:
          VERSION: ${{ matrix.module.version }}
        run: ./gradlew publishAggregationToCentralPortal -PreleaseVersion="$VERSION"
